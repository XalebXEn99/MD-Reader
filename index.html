<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Press+Start+2P&family=Outfit:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/14.1.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
</head>
<body data-theme="default">
  <div class="app-wrapper">

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <div id="tab-bar" class="tab-bar"></div>
        <button id="add-tab-btn" class="add-tab-btn" title="Open another .md file">+</button>
        <input type="file" id="file-input-2" accept=".md,.markdown,.mdown,.mkd" hidden />
      </div>
      <div class="top-bar-right">
        <button id="settings-btn" class="icon-btn" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <div class="theme-dropdown">
          <button id="theme-toggle" class="icon-btn" title="Theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </button>
          <div id="theme-menu" class="theme-menu hidden">
            <button class="theme-option active" data-theme="default">Default</button>
            <button class="theme-option" data-theme="scifi">Sci-Fi</button>
            <button class="theme-option" data-theme="pixel">Pixel Art</button>
            <button class="theme-option" data-theme="office">Office</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Upload Screen -->
    <div id="upload-screen" class="upload-screen">
      <div class="logo">MD Reader</div>
      <p class="subtitle">Upload a Markdown file to view it rendered</p>
      <div id="drop-zone" class="drop-zone">
        <div class="drop-zone-inner">
          <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <p class="drop-text">Drag &amp; drop a .md file here</p>
          <p class="drop-or">or</p>
          <label class="btn-pick" for="file-input">Browse files</label>
          <input type="file" id="file-input" accept=".md,.markdown,.mdown,.mkd" hidden />
        </div>
      </div>
    </div>

    <!-- Viewer Screen -->
    <div id="viewer-screen" class="viewer-screen hidden">
      <article id="markdown-output" class="markdown-body"></article>
    </div>

    <!-- AI floating button (appears on text selection) -->
    <button id="ai-float-btn" class="ai-float-btn hidden" title="Ask AI about selection">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
        <path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/>
        <line x1="10" y1="22" x2="14" y2="22"/>
      </svg>
      Ask AI
    </button>

    <!-- AI Modal -->
    <div id="ai-modal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h3>Ask AI</h3>
          <button id="ai-modal-close" class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <div id="ai-selection-preview" class="ai-selection-preview"></div>
          <div class="ai-input-row">
            <input id="ai-question-input" type="text" placeholder="Ask a question about the selected text..." />
            <button id="ai-send-btn" class="ai-send-btn">Send</button>
          </div>
          <div id="ai-response" class="ai-response hidden"></div>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h3>Settings</h3>
          <button id="settings-modal-close" class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <label class="settings-label" for="api-key-input">Google Gemini API Key</label>
          <p class="settings-hint">Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a></p>
          <div class="ai-input-row">
            <input id="api-key-input" type="password" placeholder="Paste your API key..." />
            <button id="save-api-key-btn" class="ai-send-btn">Save</button>
          </div>
          <p id="settings-saved-msg" class="settings-saved hidden">Key saved.</p>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
